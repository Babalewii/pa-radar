<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Synthetic PA Radar</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020617;color:#f1f5f9;font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:18px;margin:0}
#status{font-size:12px;color:#94a3b8;text-align:right}
.chips{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto}
.chip{border:0;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;background:#1e293b;color:#cbd5e1}
.chip.on{background:#0284c7;color:#fff}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:12px;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:6px;background:#334155;margin-left:6px}
.tag.s{background:#f59e0b22;color:#fcd34d;border:1px solid #f59e0b66}
.badge{font-weight:700;font-size:14px;padding:6px 14px;border-radius:10px}
.buy{background:#10b981;color:#022c22}.sell{background:#f43f5e;color:#4c0519}
.pat{margin-top:4px;font-size:14px;color:#cbd5e1}
.meta{margin-top:4px;font-size:12px;color:#64748b;display:flex;justify-content:space-between}
#empty{text-align:center;color:#64748b;margin-top:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Synthetic PA Radar</h1><div id="status">Starting...</div></div>
  <div class="chips" id="tfs"></div>
  <div class="chips" id="cats"></div>
  <div id="list"></div>
  <div id="empty" hidden>No active signals.</div>
</div>
<script>
// ===== CONFIG (public data only, no credentials needed) =====
const ENDPOINTS = [
  "wss://api.derivws.com/trading/v1/options/ws/public",
  "wss://ws.derivws.com/websockets/v3?app_id=1089"
];
const COUNT = 60, DELAY = 150, CYCLE_PAUSE = 10000, TIMEOUT = 15000, FR = 5;
const V="Volatility", BC="Boom/Crash", SJ="Step/Jump";
const WATCH = {
  R_10:["Volatility 10",V],R_25:["Volatility 25",V],R_50:["Volatility 50",V],R_75:["Volatility 75",V],R_100:["Volatility 100",V],
  "1HZ10V":["Vol 10 (1s)",V],"1HZ25V":["Vol 25 (1s)",V],"1HZ50V":["Vol 50 (1s)",V],"1HZ75V":["Vol 75 (1s)",V],"1HZ100V":["Vol 100 (1s)",V],
  BOOM300N:["Boom 300",BC],BOOM500:["Boom 500",BC],BOOM1000:["Boom 1000",BC],
  CRASH300N:["Crash 300",BC],CRASH500:["Crash 500",BC],CRASH1000:["Crash 1000",BC],
  stpRNG:["Step Index",SJ],JD10:["Jump 10",SJ],JD25:["Jump 25",SJ],JD50:["Jump 50",SJ],JD75:["Jump 75",SJ],JD100:["Jump 100",SJ]
};
const TFS = {M5:300, M15:900, H1:3600};

// ===== PRICE ACTION ENGINE (only candles[-2] evaluated) =====
function swings(closed){
  let sh=null, sl=null;
  for(let i=FR;i<closed.length-FR;i++){
    let isH=true,isL=true;
    for(let j=i-FR;j<=i+FR;j++){
      if(j===i)continue;
      if(closed[j].high>=closed[i].high)isH=false;
      if(closed[j].low<=closed[i].low)isL=false;
    }
    if(isH)sh=closed[i].high;
    if(isL)sl=closed[i].low;
  }
  return [sh,sl];
}
function detect(c){
  const out=[], n=c.length;
  if(n<2*FR+5)return out;
  const k=c[n-2], p=c[n-3], q=c[n-4];
  const [sh,sl]=swings(c.slice(0,n-1));
  if(sh!==null){
    if(k.close>sh&&p.close<=sh)out.push(["Bullish BOS","BUY",1]);
    if(k.high>sh&&k.close<sh)out.push(["Bearish Swing Sweep","SELL",1]);
  }
  if(sl!==null){
    if(k.close<sl&&p.close>=sl)out.push(["Bearish BOS","SELL",1]);
    if(k.low<sl&&k.close>sl)out.push(["Bullish Swing Sweep","BUY",1]);
  }
  const body=Math.abs(k.close-k.open), rng=k.high-k.low;
  const up=k.high-Math.max(k.open,k.close), lo=Math.min(k.open,k.close)-k.low;
  if(rng>0){
    if(lo>=2.5*body&&up<=0.15*rng)out.push(["Bullish Pin Bar","BUY",2]);
    if(up>=2.5*body&&lo<=0.15*rng)out.push(["Bearish Pin Bar","SELL",2]);
    if(p.close<p.open&&k.close>k.open&&body>0.5*rng&&k.open<=p.close&&k.close>=p.open)out.push(["Bullish Engulfing","BUY",2]);
    if(p.close>p.open&&k.close<k.open&&body>0.5*rng&&k.open>=p.close&&k.close<=p.open)out.push(["Bearish Engulfing","SELL",2]);
  }
  if(p.high<=q.high&&p.low>=q.low){
    if(k.close>q.high)out.push(["Inside Bar Breakout","BUY",2]);
    else if(k.close<q.low)out.push(["Inside Bar Breakout","SELL",2]);
  }
  return out;
}

// ===== STATE + UI =====
const signals = {};
let tf="ALL", cat="ALL", lastScan="";
try{ tf=localStorage.getItem("tf")||"ALL"; cat=localStorage.getItem("cat")||"ALL"; }catch(e){}
const $ = id=>document.getElementById(id);
const setStatus = t=>{ $("status").textContent = t + (lastScan?" | "+lastScan:""); };
function chips(el,items,get,set){
  el.innerHTML="";
  items.forEach(v=>{
    const b=document.createElement("button");
    b.className="chip"+(get()===v?" on":"");
    b.textContent=v;
    b.onclick=()=>{set(v);try{localStorage.setItem("tf",tf);localStorage.setItem("cat",cat);}catch(e){}draw();};
    el.appendChild(b);
  });
}
function fmt(ep){ return new Date(ep*1000).toISOString().slice(0,16).replace("T"," ")+" UTC"; }
function draw(){
  chips($("tfs"),["ALL","M5","M15","H1"],()=>tf,v=>tf=v);
  chips($("cats"),["ALL",V,BC,SJ],()=>cat,v=>cat=v);
  const rows=Object.values(signals)
    .filter(s=>(tf==="ALL"||s.tf===tf)&&(cat==="ALL"||s.cat===cat))
    .sort((a,b)=>a.prio-b.prio||b.epoch-a.epoch);
  $("list").innerHTML=rows.map(s=>`<div class="card">
    <div class="row"><div><span class="name">${s.name}</span><span class="tag">${s.tf}</span>${s.prio===1?'<span class="tag s">STRUCTURE</span>':''}</div>
    <span class="badge ${s.dir==="BUY"?"buy":"sell"}">${s.dir}</span></div>
    <div class="pat">${s.pattern}</div>
    <div class="meta"><span>Price ${s.price}</span><span>${fmt(s.epoch)}</span></div></div>`).join("");
  $("empty").hidden=rows.length>0;
}
function store(sym,tfName,raw){
  const c=raw.map(x=>({open:+x.open,high:+x.high,low:+x.low,close:+x.close,epoch:x.epoch}));
  const prefix=sym+"|"+tfName+"|";
  Object.keys(signals).forEach(k=>{if(k.startsWith(prefix))delete signals[k];});
  detect(c).forEach(([pattern,dir,prio])=>{
    signals[prefix+pattern]={sym,name:WATCH[sym][0],cat:WATCH[sym][1],tf:tfName,pattern,dir,prio,
      price:c[c.length-1].close,epoch:c[c.length-2].epoch};
  });
}

// ===== WEBSOCKET SCANNER =====
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function connect(url){
  return new Promise((resolve,reject)=>{
    const ws=new WebSocket(url), pending={};
    ws.pending=pending;
    const t=setTimeout(()=>{try{ws.close()}catch(e){};reject(new Error("timeout"))},15000);
    ws.onopen=()=>{clearTimeout(t);resolve(ws)};
    ws.onerror=()=>{clearTimeout(t);reject(new Error("ws error"))};
    ws.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch(x){return}
      const p=pending[m.req_id];
      if(p){clearTimeout(p.t);delete pending[m.req_id];p.res(m);}
    };
    ws.onclose=()=>{Object.values(pending).forEach(p=>{clearTimeout(p.t);p.rej(new Error("closed"))});};
  });
}
let rid=0;
function request(ws,payload){
  return new Promise((res,rej)=>{
    const id=++rid;
    const t=setTimeout(()=>{delete ws.pending[id];rej(new Error("request timeout"))},TIMEOUT);
    ws.pending[id]={res,rej,t};
    ws.send(JSON.stringify({...payload,req_id:id}));
  });
}
async function scanForever(){
  let ep=0;
  for(;;){
    const url=ENDPOINTS[ep%ENDPOINTS.length];
    let ws;
    try{
      setStatus("Connecting...");
      ws=await connect(url);
      for(;;){
        let ok=0;
        for(const sym in WATCH){
          for(const name in TFS){
            const m=await request(ws,{ticks_history:sym,style:"candles",granularity:TFS[name],count:COUNT,end:"latest"});
            if(m.candles){store(sym,name,m.candles);ok++;draw();setStatus("Live");}
            else setStatus(`${sym} ${name}: ${(m.error&&m.error.message)||"no data"}`.slice(0,70));
            await sleep(DELAY);
          }
        }
        lastScan=new Date().toISOString().slice(11,19)+" UTC";
        setStatus(ok?`Live (${ok} feeds)`:"No data");
        if(!ok)throw new Error("no candles");
        await sleep(CYCLE_PAUSE);
      }
    }catch(e){
      setStatus("Reconnecting: "+e.message);
      try{ws&&ws.close()}catch(x){}
      ep++;
      await sleep(3000);
    }
  }
}

// keep screen awake while open (best effort)
async function wake(){try{await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
wake();
draw();
scanForever();
</script>
</body>
</html>
