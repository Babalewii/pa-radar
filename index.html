<title>Synthetic PA Radar</title><style>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script></head>
<body><div class="wrap">
<div class="top"><h1>Synthetic PA Radar</h1><div id="status">Starting...</div></div>
<div class="chips" id="tabs"></div>
<div id="p-Scanner"><div class="chips" id="stg"></div><div class="chips" id="cats"></div><div id="list"></div><div id="empty" hidden>No setups right now.</div></div>
<div id="p-Chart" hidden><select id="sym"></select><div class="chips" id="ctf"></div><div class="chips" id="lay"></div><div id="chart"></div><div class="meta" id="cinfo"></div></div>
<div id="p-Backtest" hidden><select id="bsym"></select><button class="chip on" id="run">Run backtest</button><div id="bout"></div></div>
<div class="foot">Not financial advice. Trading is risky.</div></div>
<script>
const V="Volatility",BC="Boom/Crash",SJ="Step/Jump",SY="Other Synth",FX="Forex",MET="Metals",EN="Energy",IDX="Indices",CRY="Crypto";
const CATORD=[V,BC,SJ,SY,FX,MET,EN,IDX,CRY];
const ENDPOINTS=["wss://api.derivws.com/trading/v1/options/ws/public","wss://ws.derivws.com/websockets/v3?app_id=1089"];
const DELAY=150,PAUSE=5000,TIMEOUT=15000,SLOW=3e5;
const WATCH={R_10:["Volatility 10",V],R_25:["Volatility 25",V],R_50:["Volatility 50",V],R_75:["Volatility 75",V],R_100:["Volatility 100",V],
"1HZ10V":["Vol 10 (1s)",V],"1HZ25V":["Vol 25 (1s)",V],"1HZ50V":["Vol 50 (1s)",V],"1HZ75V":["Vol 75 (1s)",V],"1HZ100V":["Vol 100 (1s)",V],
BOOM300N:["Boom 300",BC],BOOM500:["Boom 500",BC],BOOM1000:["Boom 1000",BC],CRASH300N:["Crash 300",BC],CRASH500:["Crash 500",BC],CRASH1000:["Crash 1000",BC],
stpRNG:["Step Index",SJ],JD10:["Jump 10",SJ],JD25:["Jump 25",SJ],JD50:["Jump 50",SJ],JD75:["Jump 75",SJ],JD100:["Jump 100",SJ]};
const REAL={frxEURUSD:["EUR/USD",FX],frxGBPUSD:["GBP/USD",FX],frxUSDJPY:["USD/JPY",FX],frxAUDUSD:["AUD/USD",FX],frxUSDCAD:["USD/CAD",FX],frxUSDCHF:["USD/CHF",FX],frxNZDUSD:["NZD/USD",FX],
frxXAUUSD:["Gold XAU/USD",MET],frxBROUSD:["Brent Oil",EN],frxWTIUSD:["WTI Crude",EN],OTC_NDX:["Nasdaq 100",IDX],OTC_DJI:["US 30",IDX],OTC_SPC:["S&P 500",IDX],cryBTCUSD:["BTC/USD",CRY]};
Object.assign(WATCH,REAL);
const OPEN={};let lastDisc=0;
const G={H4:14400,H1:3600,M15:900,M5:300,M1:60},N={H4:80,H1:150,M15:300,M5:100,M1:100};

// ===== ENGINE (closed candles only; c={o,h,l,c,t}) =====
function swings(c,k){const S=[];for(let i=k;i<c.length-k;i++){let H=1,L=1;for(let j=i-k;j<=i+k;j++){if(j===i)continue;if(c[j].h>=c[i].h)H=0;if(c[j].l<=c[i].l)L=0;}
if(H)S.push({i,p:c[i].h,t:"H"});if(L)S.push({i,p:c[i].l,t:"L"});}return S;}
function structure(c,k){const S=swings(c,k),evs=[];let tr=0,sh=null,sl=null,si=0;
for(let i=0;i<c.length;i++){while(si<S.length&&S[si].i+k<=i){const s=S[si++];if(s.t==="H")sh=s;else sl=s;}
if(sh&&c[i].c>sh.p){evs.push({type:tr===-1?"CHOCH":"BOS",dir:1,i,lvl:sh.p});tr=1;sh=null;}
else if(sl&&c[i].c<sl.p){evs.push({type:tr===1?"CHOCH":"BOS",dir:-1,i,lvl:sl.p});tr=-1;sl=null;}}
return{tr,evs,S};}
const ar=c=>{const x=c.slice(-50);return x.reduce((s,q)=>s+q.h-q.l,0)/x.length;};
function zonesOf(c,st){const Z=[],a=ar(c),n=c.length;
const push=(dir,lo,hi,kind,s)=>{if(hi-lo>4*a||hi<=lo)return;let t=0;
for(let j=s;j<n;j++){if(dir===1?c[j].c<lo:c[j].c>hi)return;if(c[j].l<=hi&&c[j].h>=lo)t++;}
Z.push({dir,lo,hi,kinds:[].concat(kind),fresh:t===0});};
st.evs.slice(-6).forEach(e=>{for(let j=e.i-1;j>=Math.max(0,e.i-20);j--){if(e.dir===1?c[j].c<c[j].o:c[j].c>c[j].o){push(e.dir,c[j].l,c[j].h,"OB",e.i+1);break;}}});
for(let i=2;i<n-1;i++){const d=c[i],r=d.h-d.l;if(r>1.6*a&&Math.abs(d.c-d.o)>.6*r){const dir=d.c>d.o?1:-1;let lo=1e18,hi=-1e18,k=0;
for(let j=i-1;j>=Math.max(0,i-3);j--){const q=c[j];if(q.h-q.l>a)break;lo=Math.min(lo,q.l);hi=Math.max(hi,q.h);k++;}
if(k)push(dir,lo,hi,dir===1?"DEMAND":"SUPPLY",i+1);}}
st.evs.slice(-4).forEach(e=>{const b=a*.4;if(e.dir===-1)push(-1,e.lvl,e.lvl+b,"SBR",e.i+1);else push(1,e.lvl-b,e.lvl,"RBS",e.i+1);});
const S4=st.S.slice(-4),T=S4.map(s=>s.t).join("");
if(T==="HLHL"&&S4[2].p>S4[0].p&&S4[3].p<S4[1].p)push(-1,S4[0].p-a*.3,S4[0].p+a*.3,"QM",S4[3].i+1);
if(T==="LHLH"&&S4[2].p<S4[0].p&&S4[3].p>S4[1].p)push(1,S4[0].p-a*.3,S4[0].p+a*.3,"QM",S4[3].i+1);
// Breaker (BRK), Mitigation (MIT) and Unicorn (BRK+UNI): swing A -> opposite swing P -> swing X, then close beyond P (MSS)
[1,-1].forEach(dir=>{const T=dir===1?"L":"H",O=dir===1?"H":"L",sw=st.S.filter(s=>s.t===T).slice(-6);
for(let q=1;q<sw.length;q++){const A=sw[q-1],X=sw[q],swept=dir===1?X.p<A.p:X.p>A.p,opp=st.S.filter(s=>s.t===O&&s.i>A.i&&s.i<X.i);if(!opp.length)continue;
const P=opp[opp.length-1];let m=-1;for(let j=X.i+1;j<n;j++){if(dir===1?c[j].c>P.p:c[j].c<P.p){m=j;break;}}
if(m<0||n-m>80)continue;let bd=0;for(let j=X.i;j<=m;j++)bd=Math.max(bd,Math.abs(c[j].c-c[j].o));if(bd<1.2*a)continue;
let b=-1;for(let j=P.i;j>=Math.max(0,P.i-5);j--){if(dir===1?c[j].c>c[j].o:c[j].c<c[j].o){b=j;break;}}if(b<0)continue;
const bl=c[b].l,bh=c[b].h;let done=false;
if(swept){for(let j=X.i+1;j<m&&j+1<n&&!done;j++){const lo=dir===1?c[j-1].h:c[j+1].h,hi=dir===1?c[j+1].l:c[j-1].l;
if(hi>lo){const zl=Math.max(bl,lo),zh=Math.min(bh,hi);if(zl<zh){push(dir,zl,zh,["BRK","UNI"],m+1);done=true;}}}}
if(!done)push(dir,bl,bh,swept?"BRK":"MIT",m+1);}});
const M=[];Z.forEach(z=>{const m=M.find(x=>x.dir===z.dir&&x.lo<=z.hi&&z.lo<=x.hi);
if(m){m.lo=Math.min(m.lo,z.lo);m.hi=Math.max(m.hi,z.hi);z.kinds.forEach(k=>{if(!m.kinds.includes(k))m.kinds.push(k);});m.fresh=m.fresh&&z.fresh;}else M.push(z);});
return M;}
function h4Info(c){const x=c.slice(0,-1),st=structure(x,2),L=x[x.length-1],P=x[x.length-2],d=L.c>L.o?1:-1,r=L.h-L.l;let state;
if(Math.abs(L.c-L.o)<.25*r)state="INDECISION";else if(d===st.tr)state="CONTINUATION";else state=(d===1?L.c>P.h:L.c<P.l)?"REVERSAL":"PULLBACK";
return{tr:st.tr,state};}
function pdInfo(c){const S=swings(c.slice(0,-1),3);let H=null,L=null;for(const s of S){if(s.t==="H")H=s;else L=s;}
if(!H||!L||H.p<=L.p)return null;return{hi:H.p,lo:L.p,eq:(H.p+L.p)/2};}
function pat(c,d){const k=c[c.length-1],p=c[c.length-2],b=Math.abs(k.c-k.o),r=k.h-k.l,u=k.h-Math.max(k.o,k.c),l=Math.min(k.o,k.c)-k.l;if(!r)return 0;
if(d===1)return((l>=2.5*b&&u<=.15*r)||(p.c<p.o&&k.c>k.o&&b>.5*r&&k.o<=p.c&&k.c>=p.o))?1:0;
return((u>=2.5*b&&l<=.15*r)||(p.c>p.o&&k.c<k.o&&b>.5*r&&k.o>=p.c&&k.c<=p.o))?1:0;}
function analyze(s,m15){const h4=h4Info(s.h4),pd=pdInfo(s.h1);if(!pd||!h4.tr)return null;
const c=m15.slice(0,-1),p=m15[m15.length-1].c,s15=structure(c,3),Z=zonesOf(c,s15),a=ar(c),R=pd.hi-pd.lo,dir=h4.tr;
const fib=dir===1?[pd.hi-.786*R,pd.hi-.5*R]:[pd.lo+.5*R,pd.lo+.786*R];
const pdOK=dir===1?p<pd.eq:p>pd.eq;let best=null;
for(const z of Z){if(z.dir!==dir)continue;const inz=p>=z.lo&&p<=z.hi,dist=inz?0:Math.min(Math.abs(p-z.lo),Math.abs(p-z.hi));
if(!inz&&(dist>1.5*a||(dir===1?p<z.lo:p>z.hi)))continue;
const sc=2+(pdOK?2:0)+(z.kinds.length-1)+(z.fresh?1:0)+(z.hi>=fib[0]&&z.lo<=fib[1]?2:0)+pat(c,dir)+(h4.state==="CONTINUATION"?1:0);
if(!best||sc>best.sc||(sc===best.sc&&dist<best.dist))best={z,sc,dist,inz};}
if(!best)return null;
const z=best.z,h=z.hi-z.lo,sl=dir===1?z.lo-.15*h-.1*a:z.hi+.15*h+.1*a,risk=Math.abs(p-sl);
let t1=dir===1?pd.hi+.272*R:pd.lo-.272*R,t2=dir===1?pd.hi+.618*R:pd.lo-.618*R;
if((t1-p)*dir<risk)t1=p+dir*1.5*risk;if((t2-p)*dir<=(t1-p)*dir)t2=p+dir*2.5*risk;
const last=s15.evs[s15.evs.length-1];
const rev=z.kinds.includes("QM")||h4.state==="REVERSAL"||!!(last&&last.type==="CHOCH"&&c.length-last.i<20);
return{dir,z,sc:best.sc,stage:best.inz&&pdOK?"ARMED":"WATCHING",entry:p,sl,t1,t2,rev,h4,pdOK};}

// ===== DATA =====
const sleep=ms=>new Promise(r=>setTimeout(r,ms));let rid=0;
function connect(url){return new Promise((res,rej)=>{const ws=new WebSocket(url);ws.pending={};
const t=setTimeout(()=>{try{ws.close()}catch(e){}rej(new Error("timeout"))},15000);
ws.onopen=()=>{clearTimeout(t);res(ws)};ws.onerror=()=>{clearTimeout(t);rej(new Error("ws error"))};
ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}const p=ws.pending[m.req_id];if(p){clearTimeout(p.t);delete ws.pending[m.req_id];p.res(m);}};
ws.onclose=()=>Object.values(ws.pending).forEach(p=>{clearTimeout(p.t);p.rej(new Error("closed"))});});}
function request(ws,pl){return new Promise((res,rej)=>{const id=++rid,t=setTimeout(()=>{delete ws.pending[id];rej(new Error("timeout"))},TIMEOUT);
ws.pending[id]={res,rej,t};ws.send(JSON.stringify({...pl,req_id:id}));});}
async function getC(ws,sym,tf,cnt){const m=await request(ws,{ticks_history:sym,style:"candles",granularity:G[tf],count:cnt||N[tf],end:"latest"});
if(!m.candles)throw new Error((m.error&&m.error.message)||"no data");return m.candles.map(x=>({o:+x.open,h:+x.high,l:+x.low,c:+x.close,t:x.epoch}));}
async function trigger(ws,sym,dir){for(const tf of["M5","M1"]){await sleep(DELAY);const c=(await getC(ws,sym,tf)).slice(0,-1),st=structure(c,2),e=st.evs[st.evs.length-1];
if(e&&e.dir===dir&&c.length-1-e.i<=3)return{tf,type:e.type};}return null;}

// ===== SYMBOL DISCOVERY (active_symbols) =====
function catOf(a){if(REAL[a.symbol])return REAL[a.symbol][1];if(a.market!=="synthetic_index")return null;const sm=a.submarket;
if(sm==="random_index")return V;if(sm==="crash_boom")return BC;if(sm==="step_index"||sm==="jump_index")return SJ;return SY;}
async function discover(ws){try{const m=await request(ws,{active_symbols:"brief",product_type:"basic"}),L=m.active_symbols;if(!L||!L.length)return;const seen={};
L.forEach(a=>{const cat=catOf(a);if(!cat)return;seen[a.symbol]=1;WATCH[a.symbol]=[WATCH[a.symbol]?WATCH[a.symbol][0]:(a.display_name||a.symbol),cat];OPEN[a.symbol]=!!a.exchange_is_open&&!a.is_trading_suspended;});
Object.keys(WATCH).forEach(k=>{if(!seen[k]){delete WATCH[k];delete signals[k];delete OPEN[k];}});
if(!WATCH[csym])csym=Object.keys(WATCH)[0];lastDisc=Date.now();fillOpts();}catch(e){if(e.message==="closed")throw e;}}

// ===== SCAN LOOP =====
async function scanOnce(ws){let ok=0,sk=0;
if(Date.now()-lastDisc>6e5)await discover(ws);
for(const sym in WATCH){if(OPEN[sym]===false){delete signals[sym];sk++;continue;}try{const s=store[sym]||(store[sym]={t:0});
if(Date.now()-s.t>SLOW){s.h4=await getC(ws,sym,"H4");await sleep(DELAY);s.h1=await getC(ws,sym,"H1");await sleep(DELAY);s.t=Date.now();}
const m=await getC(ws,sym,"M15");await sleep(DELAY);const a=analyze(s,m);
if(!a)delete signals[sym];else{if(a.stage==="ARMED"){const tg=await trigger(ws,sym,a.dir);if(tg){a.stage="TRIGGERED";a.tg=tg;a.sc+=3;}}
a.name=WATCH[sym][0];a.cat=WATCH[sym][1];a.time=new Date().toISOString().slice(11,16)+" UTC";signals[sym]=a;}
ok++;draw();setStatus("Scanning "+WATCH[sym][0]);}
catch(e){if(e.message==="closed"||e.message==="timeout")throw e;}}return ok+sk;}
async function scanForever(){let ep=0;for(;;){let ws;try{setStatus("Connecting...");ws=await connect(ENDPOINTS[ep%ENDPOINTS.length]);WS=ws;
for(;;){const ok=await scanOnce(ws);lastScan=new Date().toISOString().slice(11,19)+" UTC";setStatus(ok?"Live ("+ok+" symbols)":"No data");if(!ok)throw new Error("no data");await sleep(PAUSE);}}
catch(e){setStatus("Reconnecting: "+e.message);try{ws&&ws.close()}catch(x){}ep++;await sleep(3000);}}}
async function wake(){try{await navigator.wakeLock.request("screen")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)wake()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
// ===== UI =====
const signals={},store={};let WS=null,stg="ALL",cat="ALL",tab="Scanner",ctf="M15",csym="R_75",lastScan="";
const LAY={Zones:true,Swings:true,Structure:true,Fib:true,Setup:true},TABS=["Scanner","Chart","Backtest"];
const $=id=>document.getElementById(id),setStatus=t=>{$("status").textContent=t+(lastScan?" | "+lastScan:"");};
const fx=x=>x.toFixed(x>1000?2:x>100?3:4),RK={TRIGGERED:0,ARMED:1,WATCHING:2};
function chips(el,items,on,click){el.innerHTML="";items.forEach(v=>{const b=document.createElement("button");b.className="chip"+(on(v)?" on":"");b.textContent=v;b.onclick=()=>click(v);el.appendChild(b);});}
function render(){chips($("tabs"),TABS,v=>tab===v,v=>{tab=v;render();if(v==="Chart")loadChart();});TABS.forEach(t=>$("p-"+t).hidden=tab!==t);
if(tab==="Chart"){chips($("ctf"),["M1","M5","M15","H1","H4"],v=>ctf===v,v=>{ctf=v;render();loadChart();});chips($("lay"),Object.keys(LAY),v=>LAY[v],v=>{LAY[v]=!LAY[v];render();loadChart();});}
draw();}
function openChart(s){csym=s;tab="Chart";render();loadChart();}
function draw(){if(tab!=="Scanner")return;chips($("stg"),["ALL","TRIGGERED","ARMED","WATCHING"],v=>stg===v,v=>{stg=v;draw();});chips($("cats"),["ALL",...CATORD.filter(c=>Object.values(WATCH).some(w=>w[1]===c))],v=>cat===v,v=>{cat=v;draw();});
const rows=Object.entries(signals).map(([sym,s])=>({sym,...s})).filter(s=>(stg==="ALL"||s.stage===stg)&&(cat==="ALL"||s.cat===cat)).sort((a,b)=>RK[a.stage]-RK[b.stage]||b.sc-a.sc);
$("list").innerHTML=rows.map(s=>`<div class="card" onclick="openChart('${s.sym}')"><div class="row"><div><span class="name">${s.name}</span><span class="tag t-${s.stage}">${s.stage}</span><span class="tag ${s.rev?"t-REV":"t-CON"}">${s.rev?"REVERSAL":"CONTINUATION"}</span></div>
<span class="badge ${s.dir===1?"buy":"sell"}">${s.dir===1?"BUY":"SELL"}</span></div>
<div class="pat">${s.z.kinds.join(" + ")} · M15 zone ${fx(s.z.lo)} – ${fx(s.z.hi)}${s.z.fresh?" · fresh":""}</div>
<div class="pat">H4 ${s.dir===1?"bullish":"bearish"} (${s.h4.state.toLowerCase()}) · H1 ${s.pdOK?(s.dir===1?"discount ✓":"premium ✓"):"wrong side of 50%"}${s.tg?" · "+s.tg.tf+" "+s.tg.type:""}</div>
<div class="lv"><div>Entry<b>${fx(s.entry)}</b></div><div>SL<b>${fx(s.sl)}</b></div><div>TP1<b>${fx(s.t1)}</b></div><div>TP2<b>${fx(s.t2)}</b></div></div>
<div class="meta"><span>Score ${s.sc}/${s.tg?14:11} · RR ${(Math.abs(s.t1-s.entry)/Math.abs(s.entry-s.sl)).toFixed(1)}</span><span>${s.time}</span></div></div>`).join("");
$("empty").hidden=rows.length>0;}

// ===== CHART =====
let chart=null,cs=null,PL=[];
async function loadChart(){if(tab!=="Chart")return;$("sym").value=csym;
try{const raw=await getC(WS,csym,ctf,300);
if(!chart){chart=LightweightCharts.createChart($("chart"),{height:380,layout:{background:{color:"#020617"},textColor:"#94a3b8"},grid:{vertLines:{color:"#0f172a"},horzLines:{color:"#0f172a"}},timeScale:{timeVisible:true,secondsVisible:false}});
cs=chart.addCandlestickSeries({upColor:"#10b981",downColor:"#f43f5e",borderVisible:false,wickUpColor:"#10b981",wickDownColor:"#f43f5e"});}
PL.forEach(l=>cs.removePriceLine(l));PL=[];
cs.setData(raw.map(x=>({time:x.t,open:x.o,high:x.h,low:x.l,close:x.c})));
const c=raw.slice(0,-1),st=structure(c,3),L=(p,col,t,ls)=>PL.push(cs.createPriceLine({price:p,color:col,lineWidth:1,lineStyle:ls,title:t,axisLabelVisible:false}));
let nz=0;if(LAY.Zones)zonesOf(c,st).forEach(z=>{const col=z.dir===1?"#10b981":"#f43f5e";L(z.lo,col,z.kinds.join("+"),0);L(z.hi,col,"",0);nz++;});
if(LAY.Swings){let h=0,l=0;for(let i=st.S.length-1;i>=0&&(h<2||l<2);i--){const s=st.S[i];if(s.t==="H"&&h<2){L(s.p,"#f59e0b","R",1);h++;}else if(s.t==="L"&&l<2){L(s.p,"#38bdf8","S",1);l++;}}}
cs.setMarkers(LAY.Structure?st.evs.slice(-8).map(e=>({time:c[e.i].t,position:e.dir===1?"belowBar":"aboveBar",color:e.dir===1?"#10b981":"#f43f5e",shape:e.dir===1?"arrowUp":"arrowDown",text:e.type})):[]);
if(LAY.Fib){const h1=(store[csym]&&store[csym].h1)||await getC(WS,csym,"H1"),pd=pdInfo(h1);if(pd){const R=pd.hi-pd.lo;L(pd.hi,"#a855f7","H1 hi",2);L(pd.lo,"#a855f7","H1 lo",2);L(pd.eq,"#e2e8f0","50%",2);L(pd.hi-.618*R,"#a855f7","f.618",1);L(pd.lo+.618*R,"#a855f7","f.618",1);}}
const g=signals[csym];if(LAY.Setup&&g){L(g.entry,"#f1f5f9","Entry",0);L(g.sl,"#ef4444","SL",0);L(g.t1,"#22c55e","TP1",0);L(g.t2,"#22c55e","TP2",0);}
$("cinfo").innerHTML=`<span>${WATCH[csym][0]} · ${ctf}</span><span>${nz} zones${g?" · "+g.stage+" "+(g.dir===1?"BUY":"SELL"):""}</span>`;
}catch(e){$("cinfo").textContent="Chart: "+e.message+" (wait for connection)";}}
setInterval(()=>{if(tab==="Chart")loadChart();},15000);

// ===== BACKTEST (M15 replay, ARMED entries, TP1 vs SL) =====
function stats(T){const n=T.length,w=T.filter(x=>x.r>0),gp=w.reduce((s,x)=>s+x.r,0),gl=-T.filter(x=>x.r<=0).reduce((s,x)=>s+x.r,0);let eq=0,pk=0,dd=0;const pts=[0];
T.forEach(x=>{eq+=x.r;pts.push(eq);pk=Math.max(pk,eq);dd=Math.min(dd,eq-pk);});return{n,win:n?100*w.length/n:0,avg:n?eq/n:0,pf:gl?gp/gl:(gp?99:0),dd,pts,net:eq};}
async function runBT(){const out=$("bout"),all=$("bsym").value==="ALL",syms=all?Object.keys(WATCH):[$("bsym").value],T=[];
if(!WS){out.textContent="Not connected yet.";return;}
for(const sym of syms){let m,h1,h4;try{out.textContent="Loading "+WATCH[sym][0]+"...";m=await getC(WS,sym,"M15",3000);await sleep(DELAY);h1=await getC(WS,sym,"H1",800);await sleep(DELAY);h4=await getC(WS,sym,"H4",300);await sleep(DELAY);}catch(e){continue;}
out.textContent="Testing "+WATCH[sym][0]+"... ("+T.length+" trades)";let k4=0,k1=0,busy=-1;const seen={};
for(let i=300;i<m.length-1;i++){if(i%40===0)await sleep(0);if(i<=busy)continue;const t=m[i].t;
while(k4+1<h4.length&&h4[k4+1].t<=t)k4++;while(k1+1<h1.length&&h1[k1+1].t<=t)k1++;if(k4<12||k1<20)continue;
let a;try{a=analyze({h4:h4.slice(Math.max(0,k4-79),k4+1),h1:h1.slice(Math.max(0,k1-149),k1+1)},m.slice(i-299,i+1));}catch(e){continue;}
if(!a||a.stage!=="ARMED")continue;const key=a.z.lo+"|"+a.z.hi+"|"+a.dir;if(seen[key])continue;seen[key]=1;
const risk=Math.abs(a.entry-a.sl),rr=Math.abs(a.t1-a.entry)/risk;let r=null,j=i+1;
for(;j<m.length&&j<i+200;j++){const q=m[j];if(a.dir===1?q.l<=a.sl:q.h>=a.sl){r=-1;break;}if(a.dir===1?q.h>=a.t1:q.l<=a.t1){r=rr;break;}}
if(r===null){j=Math.min(j,m.length-1);r=(m[j].c-a.entry)*a.dir/risk;}
busy=j;T.push({t,r,label:a.z.kinds.join(" + "),rev:a.rev});}}
if(!T.length){out.textContent="No trades found.";return;}
T.sort((a,b)=>a.t-b.t);const s=stats(T),W=300,H=90,mn=Math.min(...s.pts),rg=(Math.max(...s.pts)-mn)||1;
const pl=s.pts.map((v,i)=>(i/(s.pts.length-1||1)*W).toFixed(1)+","+(H-(v-mn)/rg*H).toFixed(1)).join(" "),grp={};
T.forEach(x=>[x.label,x.rev?"REVERSAL":"CONTINUATION"].forEach(k=>(grp[k]=grp[k]||[]).push(x)));
const rows=Object.entries(grp).sort((a,b)=>b[1].length-a[1].length).slice(0,12).map(([k,v])=>{const q=stats(v);return`<tr><td>${k}</td><td>${q.n}</td><td>${q.win.toFixed(0)}%</td><td>${q.avg.toFixed(2)}R</td></tr>`;}).join("");
out.innerHTML=`<div class="lv"><div>Trades<b>${s.n}</b></div><div>Win rate<b>${s.win.toFixed(1)}%</b></div><div>Avg R<b>${s.avg.toFixed(2)}</b></div><div>Profit factor<b>${s.pf.toFixed(2)}</b></div></div>
<div class="lv"><div>Net R<b>${s.net.toFixed(1)}</b></div><div>Max DD<b>${s.dd.toFixed(1)}R</b></div></div>
<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px;background:#0f172a;border-radius:10px"><polyline fill="none" stroke="#38bdf8" stroke-width="1.5" points="${pl}"/></svg>
<table><tr><th>Setup</th><th>N</th><th>Win</th><th>Avg R</th></tr>${rows}</table>
<div class="foot">Replays about 30 days of M15 history. Entry when price is inside a zone on the correct H1 side (no M1/M5 trigger). TP1 vs SL, SL wins if both hit in one candle, one trade at a time per symbol. Past results do not predict future results.</div>`;}
$("run").onclick=runBT;
function fillOpts(){const o=Object.keys(WATCH).map(s=>`<option value="${s}">${WATCH[s][0]}</option>`).join(""),bv=$("bsym").value;
$("sym").innerHTML=o;$("bsym").innerHTML='<option value="ALL">All symbols (slow)</option>'+o;$("sym").value=csym;if(bv&&($("bsym").querySelector('option[value="'+bv+'"]')))$("bsym").value=bv;}
fillOpts();$("sym").onchange=e=>{csym=e.target.value;loadChart();};

wake();render();scanForever();
</script></body></html>
